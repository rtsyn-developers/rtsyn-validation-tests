[project]
name = "rtsyn-validation-plots"
version = "0.1.0"
description = "Generate performance and loopback plots from RTSyn validation CSV files"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10,<4",
    "pandas>=2.2,<4",
    "typer>=0.16,<1",
]

[project.scripts]
plot-tests = "plot_tests.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "plot_tests"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
